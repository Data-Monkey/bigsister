<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Big Sister</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://use.typekit.net/xfn8kna.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />  
</head>
<body>
  <script type="text/javascript" src="assets/includeHTML.js"></script>

  <header class="site-header">
    <div class="logo">
      <a href="index.html"><span class="logo-script">the big</span></a>
      <a href="index.html"><span class="logo-main">SISTER</span></a>
    </div>
    <nav class="main-nav">
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
      <a href="magazines.html">Magazines</a>
      <a href="resources.html">Resources</a>
      <a href="shop.html">Shop</a>
    </nav>
  </header>

  <main class="main-content">
	
  <video id="intro-video" autoplay muted playsinline>
    <source src="assets/images/LogoAnimation.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById('intro-video');
    video.addEventListener('ended', function () {
      video.pause();
    });
  </script>
    
	<div class="card-grid">

      <a href="magazines.html" style="display:block;">
        <div class="placeholder-box">
          <img src="assets/images/mag.png" alt="Magazines">
        </div>
        <p class="card-label">Magazines</p>
      </a>

      <a href="resources.html" style="display:block;">
        <div class="placeholder-box">
          <img src="assets/images/resource.png" alt="Resources">
        </div>
        <p class="card-label">Resources</p>
      </a>

      <a href="shop.html" style="display:block;">
        <div class="placeholder-box">
          <img src="assets/images/shop.png" alt="Shop">
        </div>
        <p class="card-label">Shop</p>
      </a>

    </div>

  </main>

  <!-- run the script to include the footer HTML content -->
  <div w3-include-html="footer.html"></div>
  <script> includeHTML(); </script>

</body>
</html>
