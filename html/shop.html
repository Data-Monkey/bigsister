<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — The Big Sister</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #model-container {
      width: 100%;
      aspect-ratio: 3 / 4;
      position: relative;
      background-color: #e0f7fb;
      border-radius: 4px;
    }

    #ui-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 0 0 4px 4px;
	  border: 2px solid #ffd9e0;
      padding: 0.6rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      flex-wrap: wrap;
      z-index: 10;
    }

    .ui-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .ui-group label {
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
    }

    #ui-container input[type="text"],
    #ui-container select {
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
    }

    #ui-container input[type="text"] {
      width: 110px;
    }

    #ui-container select {
      width: 120px;
    }

    #musicToggle {
      padding: 5px 12px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: white;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    #musicToggle:hover {
      background-color: var(--pink);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="logo">
      <span class="logo-script">the big</span>
      <span class="logo-main">SISTER</span>
    </div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="magazines.html">Magazines</a>
      <a href="news-resources.html">News &amp; Resources</a>
      <a href="shop.html" class="active">Shop</a>
    </nav>
  </header>

  <main class="main-content">

    <div class="card-grid">

      <div>
        <div class="placeholder-box-shop">
          <span class="placeholder-label">Image</span>
        </div>
        <p class="card-label">Hoodie</p>
      </div>

      <div>
        <div class="placeholder-box-shop">
          <span class="placeholder-label">Image</span>
        </div>
        <p class="card-label">T-Shirt</p>
      </div>

      <!-- 3D interactive viewer -->
      <div>
        <div id="model-container">

          <!-- Controls pinned to bottom inside the viewer -->
          <div id="ui-container">
            <div class="ui-group">
              <label for="colorPicker">Color</label>
              <input type="color" id="colorPicker" value="#ffffff">
            </div>
            <div class="ui-group">
              <label for="textInput">Text</label>
              <input type="text" id="textInput" value="My Product">
            </div>
            <div class="ui-group">
              <label for="fontSelect">Font</label>
              <select id="fontSelect">
                <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/helvetiker_regular.typeface.json">Helvetiker</option>
                <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/helvetiker_bold.typeface.json">Helvetiker Bold</option>
                <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/optimer_regular.typeface.json">Optimer</option>
                <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/gentilis_regular.typeface.json">Gentilis</option>
                <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/droid/droid_sans_regular.typeface.json">Droid Sans</option>
                <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/droid/droid_serif_regular.typeface.json">Droid Serif</option>
              </select>
            </div>
            <button id="musicToggle">Play Music</button>
          </div>

        </div>
        <p class="card-label">Customise Your Little Sister</p>
      </div>

    </div>

  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>

  <script type="module" src="/assets/model.js"></script>

</body>
</html>
