<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — The Big Sister</title>
  <link rel="stylesheet" href="https://use.typekit.net/xfn8kna.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/model.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

</head>

<body>
  <script type="text/javascript" src="assets/includeHTML.js"></script>
  <header class="site-header">
    <div class="logo">
      <a href="index.html"><span class="logo-script">the big</span></a>
      <a href="index.html"><span class="logo-main">SISTER</span></a>
    </div>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="magazines.html">Magazines</a>
      <a href="resources.html">Resources</a>
      <a href="shop.html" class="active">Shop</a>
    </nav>
  </header>

  <main class="main-content">

    <h1 class="page-title">Shop &amp; Create</h1>

    <div class="card-grid shop-grid">

      <!-- Column 1 -->
      <div class="shop-item">
        <div class="placeholder-box-shop carousel">
          <button class="carousel-btn prev" onclick="moveSlide(this, -1)">&#10094;</button>
          <div class="carousel-track">
            <img src="assets/images/pinkhoodie 2.jpg" alt="Hoodie Front" class="active">
            <img src="assets/images/pinkon.jpg" alt="Hoodie Try On">
            <img src="assets/images/pinkdetail.png" alt="Hoodie Detail">
          </div>
          <button class="carousel-btn next" onclick="moveSlide(this, 1)">&#10095;</button>
          <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
        <p class="card-label">Brave Blossom Hoodie</p>
      </div>

      <!-- Column 2 -->
      <div class="shop-item">
        <div class="placeholder-box-shop carousel">
          <button class="carousel-btn prev" onclick="moveSlide(this, -1)">&#10094;</button>
          <div class="carousel-track">
            <img src="assets/images/purplehoodie.jpg" alt="Hoodie Front" class="active">
            <img src="assets/images/blueon.jpg" alt="Hoodie Try On">
            <img src="assets/images/bluedetail.png" alt="Hoodie Detail">
          </div>
          <button class="carousel-btn next" onclick="moveSlide(this, 1)">&#10095;</button>
          <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
        <p class="card-label">Calming Lavender Hoodie</p>
      </div>

      <!-- Column 3 -->
      <div class="shop-item">
        <div class="customization-station-wrapper">
          <h2 class="station-heading">Customisation Station</h2>
          <div class="station-card">
            <div id="model-container">
              <div id="ui-container">
                <div class="ui-group">
                  <label for="colorPicker">Color</label>
                  <input type="color" id="colorPicker" value="#ffffff">
                </div>
                <div class="ui-group">
                  <label for="textInput">Text</label>
                  <input type="text" id="textInput" value="Little Sister">
                </div>
                <div class="ui-group">
                  <label for="fontSelect">Font</label>
                  <select id="fontSelect">
                    <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/helvetiker_regular.typeface.json">Helvetiker</option>
                    <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/helvetiker_bold.typeface.json">Helvetiker Bold</option>
                    <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/optimer_regular.typeface.json">Optimer</option>
                    <option value="https://cdn.jsdelivr.net/npm/three/examples/fonts/gentilis_regular.typeface.json">Gentilis</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <p class="station-description">
            Have fun customizing your own 3D Little Sister!
          </p>
        </div>
      </div>

    </div>

  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>

  <script type="module" src="assets/model.js"></script>

  <script src="assets/carousel.js"></script>


  <!-- run the script to include the footer HTML content -->
  <div w3-include-html="footer.html"></div>
  <script> includeHTML(); </script>

</body>
</html>
