<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — The Big Sister</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #model-container {
      width: 100%;
      aspect-ratio: 3 / 4;
      position: relative;
      background-color: #e0f7fb;
      border-radius: 4px;
    }

    #ui-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(4px);
      border-radius: 0 0 4px 4px;
	  border: 2px solid #ffd9e0;
      padding: 0.6rem 1rem;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      flex-wrap: wrap;
      z-index: 10;
    }

    .ui-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .ui-group label {
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
    }

    #ui-container input[type="text"],
    #ui-container select {
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
    }

    #ui-container input[type="text"] {
      width: 110px;
    }

    #ui-container select {
      width: 120px;
    }

    #musicToggle {
      padding: 5px 12px;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: white;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    #musicToggle:hover {
      background-color: var(--pink);
    }
  </style>
</head>
<body>


  <!-- Import the component -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

<!-- Use it like any other HTML element -->
<model-viewer alt="test" src="3d_model.glb" ar shadow-intensity="1" camera-controls touch-action="pan-y"></model-viewer>

</body>
</html>
